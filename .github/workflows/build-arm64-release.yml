
name: Build CoMaps ARM64 Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 200

      - name: Configure and download submodules
        shell: bash
        run: |
          git config --file .gitmodules \
            submodule.tools/kothic.url \
            https://codeberg.org/comaps/kothic.git

          git config --file .gitmodules \
            submodule.3party/protobuf/protobuf.url \
            https://codeberg.org/comaps/protobuf.git

          git config --file .gitmodules \
            submodule.3party/just_gtfs.url \
            https://codeberg.org/comaps/just_gtfs.git

          git submodule sync --recursive
          git submodule update --init --recursive --jobs 4

      - name: Install map symbol dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            optipng \
            qt6-base-dev \
            qt6-svg-dev \
            qt6-positioning-dev \
            libicu-dev \
            libfreetype-dev \
            libharfbuzz-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev

      - name: Configure CoMaps Python environment
        shell: bash
        run: |
          sudo apt-get install -y python3-venv
          ./configure.sh

      - name: Generate map symbols
        shell: bash
        run: |
          bash tools/unix/generate_symbols.sh

      - name: Verify generated map symbols
        shell: bash
        run: |
          test -s data/symbols/hdpi/light/symbols.sdf
          test -s data/symbols/hdpi/dark/symbols.sdf
          echo "Map symbols generated successfully"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android dependencies
        shell: bash
        run: |
          sdkmanager "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build and verify signed ARM64 release
        shell: bash
        working-directory: android
        env:
          COMAPS_RELEASE_PASSWORD: ${{ secrets.COMAPS_RELEASE_PASSWORD }}
          COMAPS_RELEASE_KEYSTORE_B64: ${{ secrets.COMAPS_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail

          : "${COMAPS_RELEASE_PASSWORD:?Missing signing password}"
          : "${COMAPS_RELEASE_KEYSTORE_B64:?Missing signing keystore}"

          printf '%s' "$COMAPS_RELEASE_KEYSTORE_B64" \
            | base64 --decode \
            > app/comaps-sansbrowser-release.p12

          chmod 600 app/comaps-sansbrowser-release.p12
          test -s app/comaps-sansbrowser-release.p12

          cat > app/secure.properties.release <<'EOF'
          project.ext["secretReleaseStoreFile"] = "comaps-sansbrowser-release.p12"
          project.ext["secretReleaseStorePassword"] = System.getenv("COMAPS_RELEASE_PASSWORD")
          project.ext["secretReleaseKeyAlias"] = "comaps-release"
          project.ext["secretReleaseKeyPassword"] = System.getenv("COMAPS_RELEASE_PASSWORD")
          EOF

          chmod 600 app/secure.properties.release

          ./gradlew \
            -Pandroidauto=true \
            -Parm64 \
            assembleFdroidRelease \
            --stacktrace

          APK=$(find app/build/outputs/apk \
            -name '*.apk' -type f -print -quit)

          test -n "$APK"
          test -s "$APK"

          unzip -Z1 "$APK" > "$RUNNER_TEMP/apk-entries.txt"

          grep -qE \
            '^lib/arm64-v8a/.+\.so$' \
            "$RUNNER_TEMP/apk-entries.txt"

          grep -qE \
            'symbols/hdpi/light/symbols\.sdf$' \
            "$RUNNER_TEMP/apk-entries.txt"

          if grep -qE \
            '^lib/(x86|x86_64|armeabi-v7a)/' \
            "$RUNNER_TEMP/apk-entries.txt"; then
            echo "ERROR: Unexpected native architecture"
            exit 1
          fi

          keytool -exportcert \
            -keystore app/comaps-sansbrowser-release.p12 \
            -storetype PKCS12 \
            -storepass:env COMAPS_RELEASE_PASSWORD \
            -alias comaps-release \
            -file "$RUNNER_TEMP/release-cert.der"

          EXPECTED_SHA256=$(sha256sum \
            "$RUNNER_TEMP/release-cert.der" | awk '{print $1}')

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            verify --verbose --print-certs "$APK" \
            > "$RUNNER_TEMP/signature-report.txt"

          if ! grep -Fq \
            "Signer #1 certificate SHA-256 digest: $EXPECTED_SHA256" \
            "$RUNNER_TEMP/signature-report.txt"; then
            echo "ERROR: APK is not signed with the expected release key"
            exit 1
          fi

          echo "ARM64 architecture verified"
          echo "Map symbols verified"
          echo "Release signing certificate verified"

          rm -f \
            app/comaps-sansbrowser-release.p12 \
            app/secure.properties.release

      - name: Upload signed ARM64 release APK
        uses: actions/upload-artifact@v4
        with:
          name: CoMaps-SansBrowser-ARM64-Release
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
