
name: Build CoMaps Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 200

      - name: Configure and download submodules
        shell: bash
        run: |
          git config --file .gitmodules \
            submodule.tools/kothic.url \
            https://codeberg.org/comaps/kothic.git

          git config --file .gitmodules \
            submodule.3party/protobuf/protobuf.url \
            https://codeberg.org/comaps/protobuf.git

          git config --file .gitmodules \
            submodule.3party/just_gtfs.url \
            https://codeberg.org/comaps/just_gtfs.git

          git submodule sync --recursive
          git submodule update --init --recursive --jobs 4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android dependencies
        shell: bash
        run: |
          sdkmanager "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: |
          ./gradlew \
            -Pandroidauto=true \
            -Parm64 \
            assembleFdroidDebug \
            --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CoMaps-Test-APK
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
